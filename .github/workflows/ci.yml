name: App checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'

permissions:
  contents: read

jobs:
  agentic-workflow:
    name: Agentic workflow source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c # v0.88.7
        with:
          version: v0.88.7
      - name: Check compiled workflow is current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-files --error-unmatch .github/workflows/code-review.lock.yml .github/aw/actions-lock.json > /dev/null
          gh aw compile code-review --strict --no-check-update
          git diff --exit-code -- .github/workflows/code-review.lock.yml .github/aw/actions-lock.json .gitattributes

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
